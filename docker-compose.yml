# Infrastructure only, for local development.
# The API, ingestion worker and frontend run on your host machine against these
# (dotnet run / npm run dev) until the very last step of the build plan, when we
# containerise them and add them here.
#
#   docker compose up -d      start Postgres + Elasticsearch
#   docker compose ps         check health
#   docker compose down       stop (volumes are kept)
#   docker compose down -v    stop and DELETE all data

services:
  postgres:
    image: postgres:17-alpine
    container_name: epocha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-epocha}
      POSTGRES_USER: ${POSTGRES_USER:-epocha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epocha_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Without this, `depends_on` only waits for the container to start, not for
      # Postgres to actually accept connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-epocha} -d ${POSTGRES_DB:-epocha}"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: epocha-elasticsearch
    restart: unless-stopped
    environment:
      # Single-node dev cluster. Security is switched off so the API can talk to it
      # over plain HTTP with no certificates — acceptable locally, NOT in production.
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      # Elasticsearch will happily eat all your RAM otherwise.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTIC_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Optional: a browser UI for poking at Elasticsearch indices while you develop.
  # Start it with:  docker compose --profile tools up -d
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: epocha-kibana
    profiles: ["tools"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

volumes:
  postgres-data:
  elasticsearch-data:
