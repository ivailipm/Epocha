# The ingestion service is a batch job, not a server: `up` never starts it, run it on demand
# with `docker compose run --rm ingestion` to (re-)fetch artworks.


services:
  postgres:
    image: postgres:17-alpine
    container_name: epocha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-epocha}
      POSTGRES_USER: ${POSTGRES_USER:-epocha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epocha_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Without this, `depends_on` only waits for the container to start, not for
      # Postgres to actually accept connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-epocha} -d ${POSTGRES_DB:-epocha}"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: epocha-elasticsearch
    restart: unless-stopped
    environment:
      
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTIC_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: src/Epocha.Api/Dockerfile
    container_name: epocha-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-epocha};Username=${POSTGRES_USER:-epocha};Password=${POSTGRES_PASSWORD:-epocha_dev_password}"
      Elasticsearch__Url: "http://elasticsearch:9200"
      Jwt__Secret: "${JWT_SECRET:-3zFuAwUQgsV33UM2HiACeg0cmlwmpQW6P+UyGTokRUpUdFX0B0AglHnNqf9x8on8}"
      Jwt__Issuer: "epocha-api-dev"
      Jwt__Audience: "epocha-frontend-dev"
    ports:
      - "${API_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    container_name: epocha-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  ingestion:
    build:
      context: ./backend
      dockerfile: src/Epocha.Ingestion/Dockerfile
    container_name: epocha-ingestion
    # Without a profile, a bare `up` (no service names) starts every service that isn't
    # already running — including a one-shot job like this one, which would silently
    # re-fetch artworks on every stack restart. The profile keeps it out of that set;
    # `docker compose run --rm ingestion` still works by naming it directly.
    profiles: ["jobs"]
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-epocha};Username=${POSTGRES_USER:-epocha};Password=${POSTGRES_PASSWORD:-epocha_dev_password}"
      Elasticsearch__Url: "http://elasticsearch:9200"

  
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: epocha-kibana
    profiles: ["tools"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

volumes:
  postgres-data:
  elasticsearch-data:
